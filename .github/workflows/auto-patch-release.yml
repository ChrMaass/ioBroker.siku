name: Auto Patch Release

on:
  workflow_run:
    workflows: ["Test and Release"]
    types: [completed]

permissions:
  contents: write
  actions: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: auto-patch-release-main
  cancel-in-progress: false

jobs:
  auto-patch-release:
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      vars.ENABLE_AUTO_PATCH_RELEASE == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Check out the tested main commit
        uses: actions/checkout@v7.0.0
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 22.x
          cache: npm

      - name: Evaluate whether an automatic patch release should run
        id: preflight
        shell: bash
        run: |
          git fetch origin main --tags
          git checkout -B main origin/main
          current_main="$(git rev-parse origin/main)"
          tested_sha="${{ github.event.workflow_run.head_sha }}"
          should_release=true
          reason="ready"

          if [ "$current_main" != "$tested_sha" ]; then
            should_release=false
            reason="main moved on to $current_main; skipping stale auto-release for $tested_sha"
          fi

          parent_sha="$(git rev-list --parents -n 1 HEAD | awk '{print $2}')"
          if [ "$should_release" = true ] && [ -n "$parent_sha" ]; then
            policy_output="$(mktemp)"
            node .github/scripts/auto-release-policy.cjs --base "$parent_sha" --output "$policy_output"
            policy_should_release="$(sed -n 's/^should_release=//p' "$policy_output")"
            policy_reason="$(sed -n 's/^reason=//p' "$policy_output")"
            rm -f "$policy_output"
            should_release="$policy_should_release"
            reason="$policy_reason"
          fi

          echo "should_release=$should_release" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"

      - name: Explain why the automatic patch release was skipped
        if: steps.preflight.outputs.should_release != 'true'
        shell: bash
        run: echo "${{ steps.preflight.outputs.reason }}"

      - name: Install dependencies
        if: steps.preflight.outputs.should_release == 'true'
        run: npm ci

      - name: Configure Git identity
        if: steps.preflight.outputs.should_release == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Prepare non-interactive release config
        if: steps.preflight.outputs.should_release == 'true'
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const config = JSON.parse(fs.readFileSync('.releaseconfig.json', 'utf8'));

          // The manual-review plugin is useful for local releases, but it opens an
          // interactive prompt in CI. Keep the repository config unchanged and use
          // a temporary CI-only config instead.
          config.plugins = (config.plugins ?? []).filter(plugin => plugin !== 'manual-review');
          fs.writeFileSync('/tmp/releaseconfig.auto.json', `${JSON.stringify(config, null, 4)}\n`);
          NODE

      - name: Create the next patch release locally
        if: steps.preflight.outputs.should_release == 'true'
        run: npx release-script patch --config /tmp/releaseconfig.auto.json --yes --noPush --noWorkflowCheck --addPlaceholder

      - name: Persist the generated changelog placeholder
        if: steps.preflight.outputs.should_release == 'true'
        shell: bash
        run: |
          # release-script adds the next WORK IN PROGRESS placeholder after creating
          # the release commit. Preserve that post-commit change in a small follow-up
          # commit so the next automatic release still has a valid changelog anchor.
          if ! git diff --quiet -- README.md; then
            git add README.md
            git commit -m "docs: restore changelog placeholder"
          fi

      - name: Capture release metadata
        if: steps.preflight.outputs.should_release == 'true'
        id: release
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Push release commit and tag
        if: steps.preflight.outputs.should_release == 'true'
        id: push-release
        shell: bash
        run: |
          git fetch origin main --tags
          current_main="$(git rev-parse origin/main)"
          tested_sha="${{ github.event.workflow_run.head_sha }}"

          if [ "$current_main" != "$tested_sha" ]; then
            echo "main moved on to $current_main; skipping stale auto-release for $tested_sha"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git push origin HEAD:main --follow-tags
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Dispatch release publishing workflow for the new tag
        if: steps.push-release.outputs.pushed == 'true' && vars.ENABLE_NPM_RELEASE == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh workflow run test-and-release.yml --ref "$RELEASE_TAG"
